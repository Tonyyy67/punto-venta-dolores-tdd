name: punto_venta_dolores
description: Punto de venta con SQLite local para negocios de Dolores Hidalgo.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 2.3.x: la 2.4 usa sqlite3 3.x con "build hooks" que fallan en rutas largas de Windows
  sqflite_common_ffi: ">=2.3.0 <2.4.0"
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
